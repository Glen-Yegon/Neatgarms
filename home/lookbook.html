<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Explore the Neatgarms lookbook."
  >

  <meta name="theme-color" content="#000000">

  <title>Lookbook | Neatgarms</title>

  <!-- Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="look.css">
</head>


<body>

<div
  class="neat-cursor"
  id="neatCursor"
  aria-hidden="true"
>
  <span class="neat-cursor__tail">
    <span class="neat-cursor__tail-line"></span>
  </span>

  <span class="neat-cursor__star">✦</span>
</div>

  <!-- =========================================================
       NAVBAR
       ========================================================= -->

  <header class="site-header" id="siteHeader">

    <nav class="navbar">

      <!-- LOGO -->
      <a
        href="main.html"
        class="nav-logo"
        aria-label="Neatgarms home"
      >
        <img
          src="mains/logo2.png"
          alt="Neatgarms"
          draggable="false"
        >
      </a>


      <!-- DESKTOP NAV -->
      <div class="desktop-nav">

        <a href="main.html" class="nav-link">
          HOME
        </a>

        <a href="shop.html" class="nav-link">
          SHOP
        </a>

        <a href="sign.html" class="nav-link">
          DASHBOARD
        </a>

      </div>


      <!-- MOBILE MENU BUTTON -->
      <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="mobileMenu"
      >
        <span></span>
        <span></span>
      </button>

    </nav>

  </header>



  <!-- =========================================================
       LOOKBOOK HERO
       ========================================================= -->

  <main class="lookbook-hero">

    <div
      class="lookbook-marquee"
      id="lookbookMarquee"
      aria-label="Neatgarms Lookbook"
    >

      <div
        class="lookbook-track"
        id="lookbookTrack"
      >

        <!-- =====================================================
             ORIGINAL IMAGE GROUP
             ===================================================== -->

        <div class="lookbook-group">

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (21).webp"
              alt="Neatgarms lookbook campaign"
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (79).webp"
              alt="Neatgarms lookbook campaign"
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (57).webp"
              alt="Neatgarms lookbook campaign"
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (41).webp"
              alt="Neatgarms lookbook campaign"
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (37).webp"
              alt="Neatgarms lookbook campaign"
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (33).webp"
              alt="Neatgarms lookbook campaign"
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (32).webp"
              alt="Neatgarms lookbook campaign"
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (26).webp"
              alt="Neatgarms lookbook campaign"
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (12).webp"
              alt="Neatgarms lookbook campaign"
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (71).webp"
              alt="Neatgarms lookbook campaign"
              draggable="false"
            >
          </figure>

        </div>


        <!-- =====================================================
             DUPLICATE GROUP
             Required for the seamless infinite loop.
             Keep this identical to the group above.
             ===================================================== -->

        <div
          class="lookbook-group"
          aria-hidden="true"
        >

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (21).webp"
              alt=""
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (79).webp"
              alt=""
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (57).webp"
              alt=""
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (41).webp"
              alt=""
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (37).webp"
              alt=""
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (33).webp"
              alt=""
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (32).webp"
              alt=""
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (26).webp"
              alt=""
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (12).webp"
              alt=""
              draggable="false"
            >
          </figure>

          <figure class="lookbook-frame">
            <img
              src="future/optimized/f1 (71).webp"
              alt=""
              draggable="false"
            >
          </figure>

        </div>

      </div>

    </div>


    <!-- Subtle load overlay -->
    <div
      class="load-curtain"
      id="loadCurtain"
      aria-hidden="true"
    ></div>

  </main>



  <!-- =========================================================
       MOBILE FULLSCREEN MENU
       ========================================================= -->

  <div
    class="mobile-menu"
    id="mobileMenu"
    aria-hidden="true"
  >

    <!-- background noise / texture -->
    <div class="menu-noise"></div>


    <!-- TOP -->
    <div class="mobile-menu-top">

      <a
        href="main.html"
        class="mobile-logo"
        aria-label="Neatgarms home"
      >
        <img
          src="mains/logo2.png"
          alt="Neatgarms"
          draggable="false"
        >
      </a>


      <button
        class="menu-close"
        id="menuClose"
        type="button"
        aria-label="Close menu"
      >
        <span></span>
        <span></span>
      </button>

    </div>


    <!-- LINKS -->
    <nav class="mobile-menu-links">

      <a href="main.html" class="mobile-link">

        <span class="mobile-link-text">
          HOME
        </span>

        <span class="mobile-link-number">
          01
        </span>

      </a>


      <a href="shop.html" class="mobile-link">

        <span class="mobile-link-text">
          SHOP
        </span>

        <span class="mobile-link-number">
          02
        </span>

      </a>


      <a href="sign.html" class="mobile-link">

        <span class="mobile-link-text">
          DASHBOARD
        </span>

        <span class="mobile-link-number">
          03
        </span>

      </a>

    </nav>


    <!-- BOTTOM -->
    <div class="mobile-menu-bottom">

      <span>NEATGARMS</span>

      <span>NAIROBI, KENYA</span>

    </div>

  </div>



  <!-- JS -->
  <script src="look.js" defer></script>

</body>

</html>

    <h1 style="color: white;"  class="custom-heading"> Artwork Upload.</h1>
<p>
  This space is reserved for your <span class="highlight">t-shirt graphics</span>. Simply drag, drop, and consider it done.
</p>

    <p class="b">The first step to iconic wardrobe status.</p>
  
<div class="form-container">
  <form id="myForm">

    <!-- Contact Info -->
    <input type="text" name="name" id="name" placeholder="Full Name" required /><br>
    <input type="tel" name="phone" id="phone" placeholder="Phone Number" required /><br>
    <input type="email" name="email" id="email" placeholder="Email" required /><br>

    <!-- Upload Design -->
    <label for="frontView">Front Graphic</label>
    <input type="file" id="frontView" name="frontView" accept="image/*" onchange="previewFile(this, 'frontPreview')" accept=".jpg,.jpeg,.png,.gif" />
    <div id="frontPreview" class="upload-preview"></div>

    <label for="backView">Back Graphic</label>
    <input type="file" id="backView" name="backView" accept="image/*" onchange="previewFile(this, 'backPreview')" accept=".jpg,.jpeg,.png,.gif" />
    <div id="backPreview" class="upload-preview"></div><br>
<!-- Quantity -->
<div class="quantity-wrapper">
  <label for="quantity">Quantity</label>
  <div class="quantity-controls">
    <button type="button" id="decrease">-</button>
    <input type="number" id="quantity" name="quantity" min="1" value="1" required />
    <button type="button" id="increase">+</button>
  </div>
</div>

    <!-- Dynamic Products -->
    <div id="productsContainer"></div>

    <!-- Price Display -->
    <div id="price-container">
      <label>Total Price (Kshs): </label>
      <span id="totalPrice">2500</span>
    </div>

    <button id="submit" class="submit" type="submit">Submit</button>

      <button type="button" id="pay-now">Pay</button>

<script>
  function previewImage(event, previewId) {
    const file = event.target.files[0];
    const preview = document.getElementById(previewId);

    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = "block";
      };
      reader.readAsDataURL(file);
    }
  }

</script>

<script>
  const form = document.getElementById("myForm");
  const submitBtn = document.getElementById("submit");

  form.addEventListener("submit", async (e) => {
    e.preventDefault(); // ✅ always stop native refresh

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    try {
      // 🔹 Grab Contact Info
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();

      // 🔹 Grab Quantity
      const quantity = parseInt(document.getElementById("quantity").value) || 1;

      // 🔹 Grab Uploaded Files
      const frontView = document.getElementById("frontView").files[0];
      const backView = document.getElementById("backView").files[0];

      // 🔹 Grab Products
      const products = [];
      for (let i = 1; i <= quantity; i++) {
        const size = document.getElementById(`size-${i}`).value;
        const color = document.getElementById(`color-${i}`).value;
        products.push({ size, color });
      }

      // 🔹 Grab Price
      const totalPrice = document.getElementById("totalPrice").innerText;

      // ✅ Build FormData
      const formData = new FormData();
      formData.append("name", name);
      formData.append("phone", phone);
      formData.append("email", email);
      formData.append("quantity", quantity);
      formData.append("totalPrice", totalPrice);
      formData.append("products", JSON.stringify(products));

      if (frontView) formData.append("frontView", frontView);
      if (backView) formData.append("backView", backView);

      // 🔹 Send request
      const response = await fetch("https://neatgarms-risi.onrender.com/submit-form", {
        method: "POST",
        body: formData,
      });

      const result = await response.json();
      console.log("Server response:", result);

      if (result.success) {
        alert("✅ Form submitted successfully!");
        form.reset();
        document.getElementById("frontPreview").innerHTML = "";
        document.getElementById("backPreview").innerHTML = "";
      } else {
        alert("❌ Error: " + result.message);
      }
    } catch (err) {
      console.error("Error submitting form:", err);

    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit";
    }
  });

  
</script>

<script>
  // Allowed image formats
  const allowedFormats = ['jpg', 'jpeg', 'png', 'gif'];

  // Function to validate file types
  function validateFiles() {
    const frontFile = document.getElementById('frontView').files[0];
    const backFile = document.getElementById('backView').files[0];

    for (const file of [frontFile, backFile]) {
      if (file) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (!allowedFormats.includes(ext)) {
          alert(`⚠️ Invalid file format for ${file.name}. Only JPG, JPEG, PNG, GIF allowed.`);
          return false;
        }
      }
    }
    return true;
  }

  // 1️⃣ Verify Payment function (unchanged)
  async function verifyPayment(reference, attempts = 3, delay = 3000) {
    for (let i = 0; i < attempts; i++) {
      try {
        const res = await fetch('https://neatgarms-risi.onrender.com/api/paystack/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reference })
        });

        const data = await res.json();

        if (data.status) {
          alert('✅ Payment verified!');
          const submitBtn = document.getElementById('submit');
          if (submitBtn) submitBtn.click();
          else console.warn('Submit button not found.');
          return;
        } else {
          console.log(`Attempt ${i + 1} failed:`, data.message);
        }

      } catch (error) {
        console.error(`Attempt ${i + 1} error:`, error);
      }

      if (i < attempts - 1) {
        await new Promise(resolve => setTimeout(resolve, delay));
      }
    }

    alert('⚠️ We could not verify your payment yet. Please wait or contact support.');
  }

  // 2️⃣ Handle Paystack payment
  document.getElementById('pay-now').addEventListener('click', function () {

    // Validate image files first
    if (!validateFiles()) return; // stop if invalid

    const val = id => (document.getElementById(id)?.value || '').trim();

    // Validate required fields before opening modal
    const required = [
      ['email', 'Email'],
      ['phone', 'Phone Number'],
      ['name', 'Full Name'],
      ['quantity', 'Quantity']
    ];

    for (const [id, label] of required) {
      if (!val(id)) {
        alert(`Please enter your ${label}.`);
        document.getElementById(id).focus();
        return;
      }
    }

    // Grab total price
    const totalPriceEl = document.getElementById('totalPrice');
    if (!totalPriceEl) {
      alert('Total price not found.');
      return;
    }

    const amountString = totalPriceEl.textContent.trim();
    const amount = parseFloat(amountString);
    if (!amount || amount <= 0) {
      alert('Invalid total amount.');
      return;
    }

    const amountInKobo = Math.round(amount * 100);

    // Setup Paystack
    const handler = PaystackPop.setup({
      key: 'pk_live_ebc463d4a263695caa52983243908de4c27ab205',
      email: val('email'),
      amount: amountInKobo,
      currency: 'KES',
      ref: '' + (Math.floor(Math.random() * 1_000_000_000) + 1),

      callback({ reference }) {
        verifyPayment(reference);
      },

      onClose() {
        const email = val('email');
        if (email) {
          fetch('https://neatgarms-risi.onrender.com/api/payment-cancelled', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
        }
        alert('⛔ Payment cancelled');
      }
    });

    handler.openIframe();
  });
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#8a9381" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="cart.min.css"> <!-- Make sure to link your CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Pacifico&display=swap" rel="stylesheet">
    <!-- Favicons -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
   <!-- Web Manifest -->
  <link rel="manifest" href="/site.webmanifest?v=1" />
</head>
<body>
  <!-- Transition overlay -->
<div id="page-transition">
  <div class="logo-wrapper">
    <img src="mains/logo2.png" alt="Logo">
  </div>
</div>


  <!-- Cart Modal or Section -->
  <div id="cart-modal">
    <div class="modal-content">
      <span class="close-btn" id="close-btn">BACK</span>
      <h2>Your Cart </h2>
      <div id="cart-items"></div> <!-- Product cards will be loaded here -->
      <!--combined price section-->
      <div id="combined-price-container">
        <h3>Estimated Total: KSh<span id="combined-price">0.00</span></h3>
      </div>      
      <button id="buy-now-btn">BUY NOW</button>
    </div>
  </div>

  <script src="cart.js" defer></script> <!-- Link to your cart JavaScript -->

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const links = document.querySelectorAll("a");
    const transition = document.getElementById("page-transition");

    // Function to disable transition when user uses back/forward
    window.addEventListener("pageshow", (event) => {
      const comingFromHistory =
        event.persisted ||
        window.performance.getEntriesByType("navigation")[0]?.type === "back_forward";

      if (comingFromHistory) {
        transition.classList.remove("active"); // No transition on back/forward
        sessionStorage.removeItem("transitioning");
      } else {
        // Normal link-based navigation
        if (sessionStorage.getItem("transitioning") === "true") {
          sessionStorage.setItem("transitioning", "false");
          transition.classList.remove("active"); // Fade in after animation
        } else {
          transition.classList.remove("active"); // Initial page load
        }
      }
    });

    links.forEach(link => {
      const href = link.getAttribute("href");
      if (href && !href.startsWith("#") && !href.startsWith("http")) {
        link.addEventListener("click", e => {
          e.preventDefault();
          sessionStorage.setItem("transitioning", "true");
          transition.classList.add("active");

          setTimeout(() => {
            window.location.href = href;
          }, 1500); // Match your CSS animation duration
        });
      }
    });
  });
</script>





<script>
  // Fade in effect when page loads
document.body.style.opacity = 0;
requestAnimationFrame(() => {
  document.body.style.opacity = 1;
});

</script>

</body>
</html>

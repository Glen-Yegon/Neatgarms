<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Page Not Found - Neatgarms</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #8a9381, white, #8a9381);
      color: black;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 6rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      color: #000000;
    }

    a {
      margin-top: 20px;
      display: inline-block;
      text-decoration: none;
      color: #000000;
      background: transparent;
      padding: 12px 24px;
      border-radius: 8px;
      border-bottom: 2px solid black;
      transition: 0.3s ease;
    }

    a:hover {
      background: #926e58;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Oops! The page you’re looking for doesn’t exist.</p>
  <a href="index.html">Back to Homepage →</a>
</body>
</html>
